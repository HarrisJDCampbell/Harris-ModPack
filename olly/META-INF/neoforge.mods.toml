# Olly: a code-free ("lowcode") NeoForge mod. Everything in here is data and
# assets: functions, advancements, loot, the field guide, splash texts.
# NeoForge loads it like any other mod, so it applies to every world automatically.
modLoader = "lowcodefml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/HarrisJDCampbell/Harris-ModPack/issues"

[[mods]]
modId = "olly"
version = "1.1.0"
displayName = "Olly"
authors = "Harris Campbell"
logoFile = "olly_logo.png"
description = '''
The heart of Harris ModPack. Name a dog Olly and he becomes the goodest boy:
Olly-sized, tougher, faster, and he fights cows. Also ships the Harris Field Guide,
custom advancements and splash texts.
'''

[[dependencies.olly]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"
